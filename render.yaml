# Render Blueprint — deploys the FastAPI ML service
# Usage: Render Dashboard → New → Blueprint → connect this repo

services:
  - type: web
    name: hypertension-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PATH
        value: artifacts/hypertension_model.pkl
      - key: CORS_ORIGINS
        value: "*"
